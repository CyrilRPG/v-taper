<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Carnet de musculation hors-ligne : séances, timer de repos, progression automatique des charges, calendrier et suivi du poids.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="V-Taper">
  <meta name="format-detection" content="telephone=no">
  <title>V-Taper — Carnet de muscu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view"></main>

  <div class="timer hidden" id="timer" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Navigation principale">
    <button class="tab" data-action="go" data-to="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg><span>Accueil</span></button>
    <button class="tab" data-action="go" data-to="session"><span class="tab-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><i class="tab-dot" id="tab-session-dot"></i></span><span>Séance</span></button>
    <button class="tab" data-action="go" data-to="calendar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Calendrier</span></button>
    <button class="tab" data-action="go" data-to="stats"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg><span>Progression</span></button>
    <button class="tab" data-action="go" data-to="program"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg><span>Programme</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div class="toast" id="toast" role="status"></div>

  <noscript><p style="padding:24px;color:#fff">Active JavaScript pour utiliser V-Taper.</p></noscript>

  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/session.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/program.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
